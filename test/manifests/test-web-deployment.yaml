apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: nginx:alpine
        ports:
        - containerPort: 8080
          name: http
        command:
        - sh
        - -c
        - |
          cat > /etc/nginx/conf.d/default.conf <<EOF
          server {
              listen 8080;
              location / {
                  return 200 'Hello from pod \$HOSTNAME\n';
                  add_header Content-Type text/plain;
              }
              location /health {
                  return 200 'OK';
                  add_header Content-Type text/plain;
              }
          }
          EOF
          nginx -g 'daemon off;'
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
